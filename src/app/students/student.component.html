<div class="container-fluid mt-5">
<div class="row">
    <div class="col-md-4 mb-4 mb-md-0">
        <div class="card">
            <div class="card-body">
                <h1 class="font-weight-bold">
                    {{isInEditMode ? 'Update Student' : 'Add Student'}}
                </h1>
                <div class="form-group">
                    <label for="fname">First Name*</label>
                    <input type="text" #fnameRef class="form-control">
                </div>
                <div class="form-group">
                    <label for="lname">Last Name*</label>
                    <input type="text" #lnameRef class="form-control">
                </div>
                <div class="form-group">
                    <label for="email">Email*</label>
                    <input type="text" #emailRef class="form-control">
                </div>
                <div class="form-group">
                    <label for="contact">Contact*</label>
                    <input type="text" #contactRef class="form-control">
                </div>
                <div class="form-group">
                    <label for="isActive">Is Active*</label>
                    <select #isActiveRef class="form-control">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <button 
                (click)="onStdAdd()"
                *ngIf="!isInEditMode" class="btn btn-sm btn-block btn-primary">Add Student</button>
                <button (click)="onStdUpdate()" *ngIf="isInEditMode" class="btn btn-sm btn-success btn-block">Update Student</button>
            </div>
        </div>
    </div>
    
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                    <table class="table table-bordered mb-0" *ngIf="studentsArr.length > 0; else noStd">
                        <thead>
                            <tr>
                                <th>Sr.No</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Contact</th>
                                <th>Is Active</th>
                                <th>Edit</th>
                                <th>Remove</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let std of studentsArr; let i = index; trackBy : trackByStdId">
                                <td>{{i + 1}}</td>
                                <td>{{std.fname}} {{std.lname}}</td>
                                <td>{{std.email}}</td>
                                <td>{{std.contact}}</td>
                                <td class="text-center">
                                    <span class="badge" [ngClass]="{
                                        'badge-success':std.isActive,
                                        'badge-danger':!std.isActive
                                    }">
                                    {{std.isActive ? 'Yes':'No'}}
                                    </span>
                                </td>
                                <td>
                                    <button mat-mini-fab color="primary" (click)="onStdEdit(std)"
                                    aria-label="Edit Student">
                                    <mat-icon>edit</mat-icon>
                                    </button>
                                </td>
                                <td>
                                    <button mat-mini-fab color="warn" (click)="onStdRemove(std)"
                                    aria-label="Delete Student">
                                    <mat-icon>delete</mat-icon>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            <ng-template #noStd>
            <p class="text-center text-danger">
                 No Student added yet !!!
            </p>
            </ng-template>
            </div>
        </div>
    </div>
</div>
</div>
